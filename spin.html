<!doctype html>
<html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#071b16"><title>MANGEBET | Spin Wheel Demo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#1b573b,transparent 45%),#071b16;color:#f4fff8;font:16px/1.5 system-ui,Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:900;font-size:1.35rem;text-decoration:none}.brand span{color:#22d889}.btn{display:inline-block;padding:10px 14px;border-radius:12px;text-decoration:none;font-weight:800;background:#17372a;border:1px solid #315b46;color:white}.btn.primary{background:linear-gradient(120deg,#22d889,#b8f34a);color:#082117;border:0}.card{margin-top:24px;padding:22px;border:1px solid #285141;border-radius:20px;background:#102820;text-align:center}.wheel-wrap{position:relative;width:min(78vw,340px);margin:22px auto}.pointer{position:absolute;z-index:2;top:-8px;left:calc(50% - 16px);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:34px solid #fff;filter:drop-shadow(0 2px 3px #000)}canvas{width:100%;height:auto;display:block;border-radius:50%;box-shadow:0 0 0 7px #b8f34a,0 0 0 12px #17372a}.result{min-height:30px;font-weight:800;color:#b8f34a;margin:14px}.warning{font-size:.85rem;color:#b8cfc3}.buttons{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
</style></head><body><main class="wrap"><header class="top"><a class="brand" href="https://mangebet.netlify.app" style="text-decoration:none">MAN<span>GE</span>BET</a><a class="btn" href="https://mangebet.netlify.app">← Rudi kwenye mechi</a></header><section class="card"><div style="color:#b8f34a;font-weight:800;letter-spacing:1px">BURUDANI YA DEMO</div><h1 style="margin:6px 0">🎡 Spin Wheel</h1><p style="color:#b8cfc3;margin-top:0">Bonyeza kitufe kuzungusha gurudumu la mfano.</p><div class="wheel-wrap"><div class="pointer"></div><canvas id="wheel" width="600" height="600" aria-label="Spin Wheel"></canvas></div><div id="result" class="result" aria-live="polite">Uko tayari? Bonyeza “Zungusha”.</div><div class="buttons"><button class="btn primary" id="spin" style="font-size:1rem;cursor:pointer">Zungusha gurudumu</button><a class="btn" href="https://mangebet.netlify.app">Rudi MANGEBET</a></div><p class="warning">Toleo la majaribio pekee. Matokeo hayana thamani ya pesa na hakuna malipo yanayofanyika.</p></section></main>
<script>
const canvas=document.getElementById('wheel'),ctx=canvas.getContext('2d'),result=document.getElementById('result'),button=document.getElementById('spin');
const prizes=['Pointi 10','Jaribu tena','Pointi 20','Bonus ya demo','Pointi 5','Bahati njema','Pointi 15','Jaribu tena'];
const colors=['#22d889','#153d2d','#b8f34a','#215b40','#f3c95b','#184a35','#4bcf9b','#102820'];
let angle=0,busy=false;
function draw(){const n=prizes.length,c=canvas.width/2,r=canvas.width/2-8;ctx.clearRect(0,0,600,600);for(let i=0;i<n;i++){const a=angle+i*2*Math.PI/n;ctx.beginPath();ctx.moveTo(c,c);ctx.arc(c,c,r,a,a+2*Math.PI/n);ctx.closePath();ctx.fillStyle=colors[i];ctx.fill();ctx.strokeStyle='#071b16';ctx.lineWidth=4;ctx.stroke();ctx.save();ctx.translate(c,c);ctx.rotate(a+Math.PI/n);ctx.textAlign='right';ctx.fillStyle=(i===2||i===4)?'#092016':'#fff';ctx.font='bold 22px system-ui';ctx.fillText(prizes[i],r-24,8);ctx.restore();}ctx.beginPath();ctx.arc(c,c,43,0,Math.PI*2);ctx.fillStyle='#071b16';ctx.fill();ctx.strokeStyle='#b8f34a';ctx.lineWidth=6;ctx.stroke();ctx.fillStyle='#b8f34a';ctx.textAlign='center';ctx.font='bold 19px system-ui';ctx.fillText('M',c,c+7)}
draw();
button.addEventListener('click',()=>{if(busy)return;busy=true;button.disabled=true;result.textContent='Gurudumu linazunguka…';const start=performance.now(),duration=4200,initial=angle,extra=(Math.PI*2)*(5+Math.random()*4)+Math.random()*Math.PI*2;function frame(now){const t=Math.min(1,(now-start)/duration),ease=1-Math.pow(1-t,4);angle=initial+extra*ease;draw();if(t<1){requestAnimationFrame(frame)}else{busy=false;button.disabled=false;const normalized=((Math.PI*1.5-angle)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);const idx=Math.floor(normalized/(Math.PI*2/prizes.length))%prizes.length;result.textContent='Matokeo ya demo: '+prizes[idx]+' 🎉';}}requestAnimationFrame(frame);});
</script></body></html>
