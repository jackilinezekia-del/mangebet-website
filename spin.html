<!doctype html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071b16"><title>MANGEBET Spin Wheel</title><style>
*{box-sizing:border-box}body{margin:0;background:#071b16;color:#f5fff9;font-family:Arial,sans-serif;text-align:center;padding:20px 14px}.wrap{max-width:600px;margin:auto}.brand{font-size:28px;font-weight:900;margin:8px}.brand span{color:#20d58b}.wheel{width:min(82vw,340px);aspect-ratio:1;margin:28px auto 18px;border-radius:50%;border:8px solid #d6f7b2;background:conic-gradient(#b8f34b 0 45deg,#153a30 45deg 90deg,#22d58b 90deg 135deg,#f5c842 135deg 180deg,#153a30 180deg 225deg,#b8f34b 225deg 270deg,#22d58b 270deg 315deg,#f5c842 315deg);display:grid;place-items:center;box-shadow:0 0 25px #22d58b55;position:relative}.wheel:before{content:"🎡";font-size:70px;background:#071b16;border:5px solid #d6f7b2;border-radius:50%;width:100px;height:100px;display:grid;place-items:center}.pointer{font-size:35px;color:#ffd400}.btn{border:0;border-radius:14px;padding:14px 24px;background:linear-gradient(110deg,#22d58b,#b8f34b);font-size:18px;font-weight:900}.result{font-size:20px;color:#b8f34b;min-height:34px;margin:18px}.note{color:#b0c5bc;line-height:1.6;font-size:13px}a{color:#b8f34b} @keyframes spin{to{transform:rotate(1800deg)}}.spinning{animation:spin 3s cubic-bezier(.1,.7,.1,1) forwards}</style></head><body><div class="wrap"><div class="brand">MANGE<span>BET</span></div><h1>🎡 Spin Wheel ya Demo</h1><div class="pointer">▼</div><div class="wheel" id="wheel"></div><button class="btn" id="spin">ZUNGUSHA GURUDUMU</button><div class="result" id="result">Bonyeza kujaribu</div><p class="note">Zawadi ni za mfano tu. Hakuna malipo au dau halisi. <br><a href="index.html">Rudi kwenye mechi na masoko</a></p></div><script>const prizes=["Pointi 10","Jaribu tena","Pointi 50","Bonus ya mfano","Pointi 20","Bahati nzuri"];const w=document.getElementById("wheel"),b=document.getElementById("spin"),r=document.getElementById("result");b.addEventListener("click",()=>{if(b.disabled)return;b.disabled=true;r.textContent="Inazunguka...";w.classList.remove("spinning");void w.offsetWidth;w.classList.add("spinning");setTimeout(()=>{r.textContent="Matokeo ya demo: "+prizes[Math.floor(Math.random()*prizes.length)];b.disabled=false},3050)});</script></body></html>
