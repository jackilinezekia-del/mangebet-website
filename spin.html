<!DOCTYPE html>
<html lang="sw"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071b16"><title>MANGEBET | Spin Wheel Demo</title>
<style>*{box-sizing:border-box}body{margin:0;background:#071b16;color:#f4fff9;font-family:Arial,sans-serif;text-align:center;padding:20px}.wrap{max-width:600px;margin:auto}.brand{font-size:30px;font-weight:900;margin:10px}.brand span{color:#20d995}p{color:#a9c1b7}.wheel-wrap{position:relative;width:min(82vw,360px);height:min(82vw,360px);margin:28px auto}canvas{width:100%;height:100%;border-radius:50%;border:8px solid #b8f34a;box-shadow:0 0 25px #20d99555}.pointer{position:absolute;top:-8px;left:50%;transform:translateX(-50%);z-index:2;width:0;height:0;border-left:17px solid transparent;border-right:17px solid transparent;border-top:34px solid #fff}button,.btn{display:inline-block;border:0;border-radius:15px;padding:14px 22px;font-weight:800;font-size:17px;background:linear-gradient(110deg,#20d995,#b8f34a);color:#071b16;text-decoration:none;cursor:pointer}button:disabled{opacity:.6}.result{min-height:32px;font-size:21px;font-weight:bold;color:#b8f34a;margin:18px}.notice{margin:20px 0;padding:15px;border:1px solid #5b5127;border-radius:15px;background:#2a2919;color:#f5e8ae;font-size:14px}</style></head>
<body><div class="wrap"><div class="brand">MANGE<span>BET</span></div><h1>🎡 Spin Wheel</h1><p>Gurudumu la majaribio — pointi za mfano tu.</p>
<div class="wheel-wrap"><div class="pointer"></div><canvas id="wheel" width="600" height="600" aria-label="Gurudumu la Spin"></canvas></div>
<button id="spinButton" type="button">ZUNGUSHA GURUDUMU</button><div class="result" id="result" aria-live="polite">Bonyeza kitufe kuanza.</div><a class="btn" href="index.html">← Rudi MANGEBET</a>
<div class="notice">DEMO TU: Hakuna pesa halisi, dau au malipo yanayofanyika. Matokeo ni ya burudani tu.</div></div>
<script>
(function(){const canvas=document.getElementById('wheel'),ctx=canvas.getContext('2d'),button=document.getElementById('spinButton'),result=document.getElementById('result');const prizes=['+10 POINTI','JARIBU TENA','+20 POINTI','BONASI DEMO','+5 POINTI','KARIBU TENA','+50 POINTI','BAHATI NJEMA'];const colors=['#20d995','#143b2d','#b8f34a','#16352b','#f2c94c','#153e31','#35b8a0','#203c33'];const slice=2*Math.PI/prizes.length;let rotation=0,spinning=false;
function draw(){const cx=300,cy=300,r=286;ctx.clearRect(0,0,600,600);prizes.forEach((prize,i)=>{const start=rotation+i*slice-Math.PI/2,end=start+slice;ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,start,end);ctx.closePath();ctx.fillStyle=colors[i];ctx.fill();ctx.strokeStyle='#071b16';ctx.lineWidth=4;ctx.stroke();ctx.save();ctx.translate(cx,cy);ctx.rotate(start+slice/2);ctx.textAlign='right';ctx.fillStyle='#fff';ctx.font='bold 22px Arial';ctx.fillText(prize,r-20,8);ctx.restore()});ctx.beginPath();ctx.arc(cx,cy,48,0,2*Math.PI);ctx.fillStyle='#071b16';ctx.fill();ctx.strokeStyle='#b8f34a';ctx.lineWidth=6;ctx.stroke();ctx.fillStyle='#b8f34a';ctx.font='bold 23px Arial';ctx.textAlign='center';ctx.fillText('MB',cx,cy+8)}draw();
button.addEventListener('click',()=>{if(spinning)return;spinning=true;button.disabled=true;result.textContent='Gurudumu linazunguka...';const start=rotation,extra=2*Math.PI*(5+Math.random()*4)+Math.random()*2*Math.PI,duration=3800,startTime=performance.now();function frame(now){const progress=Math.min(1,(now-startTime)/duration),eased=1-Math.pow(1-progress,4);rotation=start+extra*eased;draw();if(progress<1)requestAnimationFrame(frame);else{spinning=false;button.disabled=false;const normalized=((rotation%(2*Math.PI))+2*Math.PI)%(2*Math.PI),pointerAngle=(2*Math.PI-normalized)%(2*Math.PI),index=Math.floor(pointerAngle/slice)%prizes.length;result.textContent='Matokeo ya demo: '+prizes[index]}}requestAnimationFrame(frame)})})();
</script></body></html>
